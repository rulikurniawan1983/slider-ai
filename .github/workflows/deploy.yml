name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/slider-ai:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/slider-ai:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/slider-ai:cache,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/slider-ai || mkdir -p /opt/slider-ai && cd /opt/slider-ai
            git pull origin main
            docker-compose pull
            docker-compose up -d --build
            docker-compose exec -T nextjs npx prisma migrate deploy
            docker-compose exec -T nextjs npx prisma generate
